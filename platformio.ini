; Ecosistema domotico/industrial descentralizado sobre CAN Bus 29 bits (PCD v1)
;
;   native          -> pruebas unitarias del protocolo en escritorio
;   esp32_gateway   -> gateway / puente multiprotocolo (TWAI)
;   esp32_hmi       -> pantalla tactil CAN
;   atmega2560_node -> nodo de campo de alta densidad (MCP2515)
;   atmega328p_node -> nodo de campo compacto (MCP2515)

[platformio]
default_envs = native

[env]
build_flags =
    -Iinclude
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<hal/hal_can_esp32.cpp> -<hal/hal_can_mcp2515.cpp>
build_flags =
    ${env.build_flags}
    -DCAN_LOG_LEVEL=0
    -std=c++11

[env:esp32_gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<hal/hal_can_mcp2515.cpp> -<hal/hal_can_native.cpp>
build_flags =
    ${env.build_flags}
    -DCAN_LOG_LEVEL=2
    -DFEATURE_OTA_MANAGER=1
    -DFEATURE_WEB_SERVER=1
    -DFEATURE_MQTT_BRIDGE=1
    -DFEATURE_TUNNEL_BRIDGE=1
    -DFEATURE_MODBUS_BRIDGE=1

[env:esp32_hmi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<hal/hal_can_mcp2515.cpp> -<hal/hal_can_native.cpp>
build_flags =
    ${env.build_flags}
    -DCAN_LOG_LEVEL=1

[env:atmega2560_node]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<hal/hal_can_esp32.cpp> -<hal/hal_can_native.cpp>
build_flags =
    ${env.build_flags}
    -DCAN_LOG_LEVEL=0

[env:atmega328p_node]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<hal/hal_can_esp32.cpp> -<hal/hal_can_native.cpp>
build_flags =
    ${env.build_flags}
    -DCAN_LOG_LEVEL=0
    -DCAN_MAX_SUBSCRIPTIONS=8
