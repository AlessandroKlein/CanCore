sentence=Protocolo descentralizado peer-to-peer sobre CAN Bus 2.0B con IDs extendidos de 29 bits, agnostico al framework.
paragraph=Nucleo CAN descentralizado con nodos multifuncion, reglas de vinculacion persistentes (EEPROM/NVS), drivers TWAI (ESP32) y MCP2515 (AVR). Capa de servicios inyectable (SystemApi), bucle de eventos asincrono, plantilla CanNodeTmpl y codec CAN-sobre-IP (TunnelEngine). Los puentes de red (UDP, MQTT, KNX, Modbus, ESP-NOW, Web) se implementan en la aplicacion y usan esta libreria.
