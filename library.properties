sentence=Protocolo descentralizado peer-to-peer sobre CAN Bus 2.0B con IDs extendidos de 29 bits, agnostico al framework.
paragraph=Nucleo CAN descentralizado con nodos multifuncion, identidad manual/automatica, descubrimiento de recursos, reglas persistentes (EEPROM/NVS), perfiles de topologia lineal/estrella/arbol con hub, drivers TWAI (ESP32) y MCP2515 (AVR). Incluye SystemApi, routing, bridges MQTT/Modbus/DALI/KNX agnosticos, mapeo de objetos de grupo KNX, TunnelEngine con HMAC-SHA256, OTA emisor y receptor, watchdog de red y UI web de referencia; los adaptadores WiFi/HTTP concretos se agregan en la aplicacion.
